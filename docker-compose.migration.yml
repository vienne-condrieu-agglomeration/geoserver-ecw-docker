---
# docker-compose.migration.yml
#
# Joue MANUELLEMENT un seul palier de migration GeoServer contre le data dir de
# travail (migration/work/config), sans HTTPS ni credentials.
#
# Pour l'orchestration complete 2.17.5 -> 3.0.0, preferer ./migrate.sh.
#
# Usage :
#   # 1. initialiser la copie de travail (une fois) :
#   #    cp -a migration/src/config migration/work/config
#   # 2. jouer un palier en choisissant l'image :
#   GS_MIGRATE_IMAGE=allfab/geoserver-ecw:2.24.5 \
#     docker compose -f docker-compose.migration.yml up
#   # 3. quand le service est "healthy", laisser flush puis :
#   docker compose -f docker-compose.migration.yml down
#
# IMPORTANT : ne JAMAIS ajouter GEOSERVER_ADMIN_USER / GEOSERVER_ADMIN_PASSWORD
#             ici -> cela ecraserait le compte 'igeo' du data dir migre.

services:
  geoserver-migrate:
    container_name: gs-migrate
    image: ${GS_MIGRATE_IMAGE:-allfab/geoserver-ecw:latest}
    restart: "no"
    environment:
      - HTTPS_ENABLED=false
      - INSTALL_EXTENSIONS=false
    ports:
      - "${PORT:-8080}:8080"
    volumes:
      # data dir de travail, mute par le palier en cours (racine = /app/geoserver/config)
      - ./migration/work/config:/app/geoserver/config
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/geoserver/web/ >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 60
      start_period: 60s
