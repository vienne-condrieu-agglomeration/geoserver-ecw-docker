---
services:
  geoserver:
    container_name: geoserver
    image: allfab/geoserver:2.26.2
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./config:/app/geoserver/config
      - ./data:/app/geoserver/geo-data
      - ./gwc-cache:/app/geoserver/gwc-cache
    networks:
      - geoserver

networks:
  geoserver:
    name: geoserver
    driver: bridge