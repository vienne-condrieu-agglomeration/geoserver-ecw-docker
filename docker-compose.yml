---
services:
  geoserver:
    container_name: geoserver
    image: allfab/geoserver-ecw:latest
    restart: unless-stopped
    ports:
      - 8080:8080
    volumes:
      - ./geoserver/config:/app/geoserver/config
      - ./geoserver/data:/app/geoserver/geo-data
      - ./geoserver/logs:/app/geoserver/config/logs
      - ./geoserver/gwc/config:/app/geoserver/config/gwc
      - ./geoserver/gwc/cache:/app/geoserver/gwc-cache
    networks:
      - geoserver

networks:
  geoserver:
    name: geoserver
    driver: bridge
    